<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#071a31">
    <meta name="description" content="24 小時制時間加減及時段差計算工具">
    <title>Time Desk · 24H 時間計算機</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand-mark" aria-hidden="true">24</div>
        <div>
          <p class="eyebrow">TIME DESK · PERSONAL UTILITY</p>
          <h1>時間計數機</h1>
          <p class="subtitle">24 小時制 · 即時計算 · 手機優先</p>
        </div>
        <div class="system-status"><span></span> READY</div>
      </header>

      <section class="calculator-card" aria-labelledby="adjust-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">01 · TIME ADJUSTMENT</p>
            <h2 id="adjust-title">時間加／減</h2>
          </div>
          <button class="reset-button" type="button" data-reset="adjust">重設</button>
        </div>

        <div class="adjust-grid">
          <label class="field time-field">
            <span>原本時間</span>
            <input id="base-time" type="time" inputmode="numeric" step="60" aria-describedby="base-time-note">
            <small id="base-time-note">24 小時制</small>
          </label>

          <fieldset class="operation" aria-label="運算方式">
            <legend>運算</legend>
            <div class="segmented-control">
              <input id="op-add" name="operation" type="radio" value="add" checked>
              <label for="op-add">＋ 加</label>
              <input id="op-subtract" name="operation" type="radio" value="subtract">
              <label for="op-subtract">－ 減</label>
            </div>
          </fieldset>

          <label class="field number-field">
            <span>分鐘</span>
            <input id="adjust-minutes" type="number" inputmode="numeric" min="0" max="9999" step="1" placeholder="例如 45">
            <small>可輸入 0–9999</small>
          </label>
        </div>

        <div class="result-panel" aria-live="polite">
          <div>
            <p>計算結果</p>
            <span id="adjust-message">請輸入時間及分鐘</span>
          </div>
          <output id="adjust-result" class="time-result">--:--</output>
        </div>
      </section>

      <section class="calculator-card" aria-labelledby="difference-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">02 · ELAPSED TIME</p>
            <h2 id="difference-title">兩個時間相差</h2>
          </div>
          <button class="reset-button" type="button" data-reset="difference">重設</button>
        </div>

        <div class="difference-grid">
          <label class="field time-field">
            <span>開始時間</span>
            <input id="start-time" type="time" inputmode="numeric" step="60">
          </label>
          <div class="direction" aria-hidden="true">→</div>
          <label class="field time-field">
            <span>結束時間</span>
            <input id="end-time" type="time" inputmode="numeric" step="60">
          </label>
        </div>

        <label class="midnight-toggle">
          <input id="allow-midnight" type="checkbox" checked>
          <span class="toggle-ui" aria-hidden="true"></span>
          <span><strong>跨午夜計算</strong><small>結束時間早於開始時間時，視為翌日</small></span>
        </label>

        <div class="elapsed-panel" aria-live="polite">
          <p>相差時間</p>
          <output id="difference-result">-- 分鐘</output>
          <span id="difference-detail">請輸入兩個有效時間</span>
        </div>
      </section>

      <button id="reset-all" class="reset-all" type="button">重設全部資料</button>
      <p class="disclaimer">PERSONAL TIME UTILITY · NOT AN OFFICIAL SYSTEM</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
